[package]
name = "baba-yaga"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Dependency vulnerability patrol for Switch rooms"
default-run = "baba-yaga"

[lib]
name = "baba_yaga"
path = "src/lib.rs"

[[bin]]
name = "baba-yaga"
path = "src/main.rs"

[[bin]]
name = "bay"
path = "src/bin/bay.rs"

[dependencies]
switch-client.workspace = true
tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rusqlite.workspace = true
cron.workspace = true
chrono.workspace = true
uuid.workspace = true
tempfile.workspace = true
dotenvy.workspace = true
url.workspace = true
reqwest.workspace = true
rpassword.workspace = true

# `cargo deb` (installed in the release workflow only) builds the .deb from
# this. Both binary names go to /usr/bin. osv-scanner is not packaged for
# Ubuntu, so it is not a dependency; `bay doctor` reports it when missing.
[package.metadata.deb]
maintainer = "Shoaib"
copyright = "2026, Shoaib"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Baba-Yaga scans repositories with osv-scanner, posts one Switch room thread \
per vulnerable package, and hands approved findings to a fixer agent. \
Installed as both baba-yaga and bay."""
section = "devel"
priority = "optional"
# No Debian revision, so the file is baba-yaga_<version>_amd64.deb.
revision = ""
depends = "$auto, git"
assets = [
    ["target/release/baba-yaga", "usr/bin/", "755"],
    ["target/release/bay", "usr/bin/", "755"],
    ["../../baba-yaga.example.toml", "usr/share/doc/baba-yaga/", "644"],
]
